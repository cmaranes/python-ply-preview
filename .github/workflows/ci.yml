name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run compile
      - run: npm run lint

      - name: Test Python exporter
        run: |
          pip install numpy
          python python/test_ply_export.py

      # Caches the downloaded VS Code and test extensions between runs
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}

      - name: Integration tests (real VS Code + debugpy)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Integration tests (real VS Code + debugpy)
        if: runner.os != 'Linux'
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce@3 package --out python-ply-preview.vsix
